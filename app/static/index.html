<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>karina_plokhuta — Запись к специалисту</title>
<style>body{font:16px system-ui;background:#f3f6fa;color:#17243a;max-width:1100px;margin:30px auto;padding:0 22px}h1{font-size:28px}section{background:white;padding:22px;margin:16px 0;border-radius:12px}input,select,button{font:inherit;padding:8px;margin:4px;border:1px solid #bdc7d6;border-radius:6px}button{cursor:pointer;background:#164da2;color:white}table{border-collapse:collapse;width:100%;margin:12px 0}td,th{text-align:left;padding:9px;border-bottom:1px solid #ddd}pre{white-space:pre-wrap}#message{color:#9b260f}small{color:#52637a}nav button{background:white;color:#164da2}</style>
<h1>Запись к специалисту</h1><small>Плохута Карина Дмитриевна · БИСТ-24-ПО-3 · karina_plokhuta</small>
<section id="login"><h2>Вход</h2><input id="username" value="demo" aria-label="Логин"><input id="password" value="demo" type="password" aria-label="Пароль"><button onclick="signIn()">Войти</button></section>
<p id="message" role="alert"></p><div id="workspace" hidden><nav><button onclick="loadList()">Мои записи</button><button onclick="showBooking()">Записаться</button><button onclick="loadSummary()">Сводка</button><button onclick="location.reload()">Выйти</button></nav>
<section id="list"><h2>Мои записи</h2><select id="status" onchange="page=1;loadList()"><option value="">Все статусы</option><option value="booked">Действующие</option><option value="cancelled">Отменённые</option></select><div id="listData"></div><button onclick="if(page>1){page--;loadList()}">Назад</button><button onclick="if(page*20<total){page++;loadList()}">Далее</button><span id="pages"></span></section>
<section id="detail" hidden><h2>Карточка записи</h2><div id="detailData"></div></section>
<section id="booking" hidden><h2>Новая запись</h2><label>Услуга <select id="service" onchange="loadSpecialists()"></select></label><label>Специалист <select id="specialist"></select></label><br><label>Начало <input id="start" type="date" value="2026-10-01"></label><label>Конец <input id="end" type="date" value="2027-02-04"></label><button onclick="findSlots()">Найти свободное время</button><div id="slotsData"></div></section>
<section id="summary" hidden><h2>Загрузка специалистов</h2><label>Начало <input id="sumStart" type="date" value="2026-10-01"></label><label>Конец <input id="sumEnd" type="date" value="2027-02-04"></label><button onclick="loadSummary()">Рассчитать</button><div id="summaryData"></div></section></div>
<script>
let credentials='',page=1,total=0;const el=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=x=>new Date(x).toLocaleString('ru-RU');
async function api(path,method='GET',body){el('message').textContent='';try{let r=await fetch('/api/'+path,{method,headers:{Authorization:'Basic '+credentials,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});let d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'Проверьте параметры запроса');return d}catch(e){el('message').textContent=e.message;throw e}}
function show(id){for(let x of ['list','detail','booking','summary'])el(x).hidden=x!==id}
async function signIn(){credentials=btoa(el('username').value+':'+el('password').value);try{await api('auth');el('login').hidden=true;el('workspace').hidden=false;await loadList()}catch{}}
async function loadList(){show('list');let d=await api('appointments?'+new URLSearchParams({page,size:20,...(el('status').value?{status:el('status').value}:{})}));total=d.total;el('listData').innerHTML='<table><tr><th>№</th><th>Специалист</th><th>Услуга</th><th>Время</th><th>Статус</th></tr>'+d.items.map(a=>`<tr><td><button onclick="loadDetail(${a.id})">${a.id}</button></td><td>${esc(a.specialist)}</td><td>${esc(a.service)}</td><td>${date(a.starts_at)}</td><td>${a.status==='booked'?'Действует':'Отменена'}</td></tr>`).join('')+'</table>';el('pages').textContent=`Страница ${page} · всего ${total}`}
async function loadDetail(id){let a=await api('appointments/'+id);show('detail');el('detailData').innerHTML=`<p>Запись № ${a.id} · ${a.status==='booked'?'Действует':'Отменена'}</p><p>${esc(a.specialist)} · ${esc(a.service)} · ${a.duration_minutes} мин.</p><p>${date(a.starts_at)} — ${date(a.ends_at)}</p><p>Слот № ${a.slot_id}: ${date(a.slot_starts_at)} — ${date(a.slot_ends_at)}</p>`+(a.status==='booked'?`<button onclick="cancelBooking(${id})">Отменить запись</button>`:'')}
async function cancelBooking(id){await api('appointments/'+id+'/cancel','POST');await loadDetail(id)}
async function showBooking(){show('booking');let d=await api('services');el('service').innerHTML=d.items.map(v=>`<option value="${v.id}">${esc(v.name)} · ${v.duration_minutes} мин.</option>`).join('');await loadSpecialists()}
async function loadSpecialists(){let d=await api('specialists?service_id='+el('service').value);el('specialist').innerHTML='<option value="">Любой</option>'+d.items.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');el('slotsData').textContent=''}
function params(start,end){return {start:el(start).value+'T00:00:00Z',end:el(end).value+'T00:00:00Z'}}
async function findSlots(){let q={...params('start','end'),service_id:el('service').value,size:20,...(el('specialist').value?{specialist_id:el('specialist').value}:{})};let d=await api('slots?'+new URLSearchParams(q));el('slotsData').innerHTML=`<p>Найдено ${d.total}; показаны первые 20. Уточните период для выбора другого времени.</p>`+d.items.map(s=>`<p>${esc(s.specialist)} · ${date(s.starts_at)} <button onclick="bookSlot(${s.id})">Записаться</button></p>`).join('')}
async function bookSlot(id){let a=await api('appointments','POST',{slot_id:id,service_id:Number(el('service').value)});await loadDetail(a.id)}
async function loadSummary(){show('summary');let d=await api('summary?'+new URLSearchParams(params('sumStart','sumEnd')));el('summaryData').innerHTML=`<p>Всего записей: ${d.total} · отменено: ${d.cancelled} (${d.cancelled_percent}%)</p><small>Интервал включает начало и исключает конец. Время отображается в часовом поясе браузера.</small><table><tr><th>Специалист</th><th>Минут расписания</th><th>Занято минут</th><th>Загрузка</th></tr>`+d.items.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.available_minutes}</td><td>${s.booked_minutes}</td><td>${s.utilization_percent}%</td></tr>`).join('')+'</table>'}
</script></html>
